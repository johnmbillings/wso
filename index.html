<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wso practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <h1>wayzata symphony orchestra</h1>
    <p class="subtitle">practice pages</p>
    <img src="feather.svg" alt="" class="feather-icon">
  </header>

  <main id="concerts"></main>

  <nav class="tools">
    <a href="polyrhythm.html">polyrhythm practice</a>
    <a href="concert.html">virtual concert</a>
  </nav>

  <footer>wso</footer>

  <script>
    setTimeout(() => {
      const f = document.querySelector('.feather-icon');
      if (f) f.classList.add('glow');
    }, 20000);
  </script>

  <script>
    fetch('songs.json')
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        const container = document.getElementById('concerts');
        const concertMeta = data.concerts || {};
        const entries = Object.entries(data.songs || {});

        if (entries.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'songs coming soon';
          container.appendChild(p);
          return;
        }

        // Group by concert
        const concerts = {};
        entries.forEach(([slug, song]) => {
          const concert = song.concert || 'uncategorized';
          if (!concerts[concert]) concerts[concert] = [];
          concerts[concert].push([slug, song]);
        });

        // Active concerts first (in songs.json order), archived ones last
        const metaOrder = Object.keys(concertMeta);
        const isArchived = key => !!(concertMeta[key] && concertMeta[key].archived);
        const rank = key => {
          const i = metaOrder.indexOf(key);
          return i === -1 ? metaOrder.length : i;
        };
        const concertKeys = Object.keys(concerts).sort((a, b) => {
          if (isArchived(a) !== isArchived(b)) return isArchived(a) ? 1 : -1;
          return rank(a) - rank(b);
        });

        let delay = 0.5;
        let pastLabelAdded = false;
        for (const concert of concertKeys) {
          const songs = concerts[concert];
          const archived = isArchived(concert);

          if (archived && !pastLabelAdded) {
            pastLabelAdded = true;
            const pastLabel = document.createElement('p');
            pastLabel.className = 'past-label';
            pastLabel.textContent = 'past concerts';
            pastLabel.style.animationDelay = delay + 's';
            container.appendChild(pastLabel);
          }

          const section = document.createElement('div');
          section.className = archived ? 'concert archived' : 'concert';
          section.style.animationDelay = delay + 's';
          delay += 0.15;

          const header = document.createElement('div');
          header.className = 'concert-header';

          const meta = concertMeta[concert];
          const h2 = document.createElement('h2');
          h2.className = 'concert-name';
          h2.textContent = meta ? meta.name : concert;
          header.appendChild(h2);

          if (meta && meta.date) {
            const dateSpan = document.createElement('span');
            dateSpan.className = 'concert-date';
            dateSpan.textContent = meta.date;
            header.appendChild(dateSpan);
          }

          section.appendChild(header);

          const ul = document.createElement('ul');
          songs.sort((a, b) => (a[1].order || 99) - (b[1].order || 99));
          songs.forEach(([slug, song]) => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = 'song.html?s=' + encodeURIComponent(slug);

            // Split composer and piece name on the em dash
            const parts = song.title.split(' — ');
            if (parts.length === 2) {
              const composerSpan = document.createElement('span');
              composerSpan.className = 'composer';
              composerSpan.textContent = parts[0] + '  ';
              a.appendChild(composerSpan);
              a.appendChild(document.createTextNode(parts[1]));
            } else {
              a.textContent = song.title;
            }

            li.appendChild(a);
            ul.appendChild(li);
          });

          section.appendChild(ul);
          container.appendChild(section);
        }
      })
      .catch(() => {
        const container = document.getElementById('concerts');
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'failed to load songs';
        container.appendChild(p);
      });
  </script>
</body>
</html>
